name: Validate

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate with Hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs_validation:
    name: HACS Validation
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: HACS validation
        uses: hacs/action@main
        with:
          ignore: brands
          category: integration

  lint:
    name: Lint and Format Check
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Python
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lint.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-lint.txt

      - name: Check formatting and lint
        run: make check-format

  test:
    # Unit tests (and mypy) against both ends of the supported Home Assistant
    # range: device_registry_compat.py (and any future version-dependent
    # code) takes a different code path on each.
    name: Tests with Coverage (HA ${{ matrix.ha }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported release (hacs.json: 2025.10.0) -> HA 2025.10.4;
          # Home Assistant 2025.10 runs on Python 3.13.
          - ha: min
            python-version: "3.13"
            requirements: requirements-test-min.txt
          # Latest release -> HA 2026.9.3; Home Assistant >= 2026.3 needs
          # Python 3.14.
          - ha: latest
            python-version: "3.14"
            requirements: requirements-test-latest.txt
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Python ${{ matrix.python-version }}
        uses: "actions/setup-python@v6"
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements-lint.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r "${{ matrix.requirements }}" -r requirements-lint.txt
          python3 -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"

      - name: Type check (mypy)
        run: mypy custom_components/zigsight/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=custom_components/zigsight --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ha-${{ matrix.ha }}
          fail_ci_if_error: false

  frontend:
    name: Frontend Checks
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Node.js
        uses: "actions/setup-node@v5"
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: make check-js

      - name: Run JavaScript unit tests
        run: make test-js

  security:
    name: Security Scan
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Python
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lint.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-lint.txt
          python3 -m pip install safety

      - name: Run Bandit security scan
        run: make security

      - name: Check dependencies for vulnerabilities
        run: safety check --json || true
        continue-on-error: true
