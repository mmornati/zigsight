recommend_channel:
  name: Recommend Zigbee channel
  description: >-
    Analyzes Wi-Fi interference and recommends the best Zigbee channel.
    Admin only: "host_scan" mode runs Wi-Fi scanning commands on the Home
    Assistant host. Returns the recommendation.
  fields:
    mode:
      name: Scan Mode
      description: How to obtain Wi-Fi scan data.
      required: false
      default: "manual"
      selector:
        select:
          options:
            - "manual"
            - "host_scan"
    wifi_scan_data:
      name: Wi-Fi Scan Data
      description: >-
        Wi-Fi access point scan data (required in "manual" mode): a list of
        objects with "channel", "rssi" and optionally "ssid", or an object
        with an "access_points" list in that shape.
      required: false
      selector:
        object:

enable_zha_diagnostic_entities:
  name: Enable ZHA diagnostic entities
  description: >-
    Enables the LQI and RSSI diagnostic sensors of ZHA devices that are
    still disabled by their default (never re-enables an entity a user
    disabled themselves). Home Assistant reloads the ZHA config entry
    ~30 seconds afterwards to create the newly enabled entities. Returns
    the number and ids of the entities enabled.
