# Minimal Mosquitto configuration for the local/CI e2e environment ONLY.
#
# Anonymous access is allowed here because this broker only ever listens on
# the docker-compose network created for the e2e stack (see
# docker-compose.yml) - it is never exposed to the host or the internet, and
# only exists for the lifetime of `make e2e`/CI. Do NOT reuse this file for
# a production Mosquitto instance.

listener 1883
allow_anonymous true

persistence false
log_dest stdout
