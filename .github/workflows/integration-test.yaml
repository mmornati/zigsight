name: Integration Test

'on':
  pull_request:
  workflow_dispatch:
    inputs:
      ha_version:
        description: >-
          Home Assistant version to test against (e.g. 2025.10.3, or
          "latest"). Leave empty to run the default matrix (pinned minimum +
          latest).
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    name: Prepare HA version matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute matrix
        id: matrix
        env:
          # Passed through the environment, never interpolated into the
          # script, so a crafted dispatch input can't inject shell.
          HA_VERSION_INPUT: ${{ github.event.inputs.ha_version }}
        run: |
          if [ -n "$HA_VERSION_INPUT" ]; then
            if ! printf '%s' "$HA_VERSION_INPUT" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
              echo "::error::Invalid ha_version input"
              exit 1
            fi
            versions=$(jq -cn --arg v "$HA_VERSION_INPUT" '[$v]')
          else
            # Single source for the pinned minimum supported version: the
            # HA_VERSION default in docker-compose.yml (also what
            # `make e2e` runs locally), plus the latest stable release.
            # shellcheck disable=SC2016 # literal ${HA_VERSION:-...} in the pattern
            pinned=$(sed -n 's/.*homeassistant\/home-assistant:${HA_VERSION:-\([^}]*\)}.*/\1/p' docker-compose.yml)
            if [ -z "$pinned" ]; then
              echo "::error::Could not read the pinned HA_VERSION default from docker-compose.yml"
              exit 1
            fi
            versions=$(jq -cn --arg v "$pinned" '[$v, "latest"]')
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Testing against: $versions"

  e2e:
    name: End-to-end (HA ${{ matrix.ha_version }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # "latest" tracks whatever Home Assistant released last: a failure there
    # is reported (red job) but doesn't block the PR; the pinned minimum
    # version does.
    continue-on-error: ${{ matrix.ha_version == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        ha_version: ${{ fromJSON(needs.prepare-matrix.outputs.versions) }}
    env:
      HA_VERSION: ${{ matrix.ha_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install e2e bootstrap dependencies
        run: python3 -m pip install --quiet -r requirements-e2e.txt

      - name: Start the e2e stack (HA + Mosquitto + Zigbee2MQTT replay)
        run: docker compose --profile e2e up -d --wait home-assistant mosquitto z2m-replay

      - name: Bootstrap and verify the environment
        run: python3 scripts/e2e_bootstrap.py

      - name: Collect Home Assistant / broker / replay logs
        if: always()
        run: |
          mkdir -p logs
          # --no-log-prefix: ci_check_ha_log.py needs lines to start with
          # Home Assistant's timestamp to find record boundaries.
          docker compose --profile e2e logs --no-color --no-log-prefix home-assistant > logs/home-assistant.log 2>&1 || true
          docker compose --profile e2e logs --no-color mosquitto > logs/mosquitto.log 2>&1 || true
          docker compose --profile e2e logs --no-color z2m-replay > logs/z2m-replay.log 2>&1 || true

      - name: Fail on ZigSight errors, tracebacks or blocking calls in the HA log
        run: python3 scripts/ci_check_ha_log.py logs/home-assistant.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ha-logs-${{ matrix.ha_version }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down the e2e stack
        if: always()
        run: docker compose --profile e2e down -v
