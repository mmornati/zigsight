# Example Lovelace Dashboard Configuration for ZigSight
#
# The card files are served by the ZigSight integration itself; nothing to
# copy into www/. To use this example:
# 1. Add the dashboard resources (Settings -> Dashboards -> Resources, type
#    "JavaScript module"), or for YAML dashboards:
#
#      lovelace:
#        mode: yaml
#        resources:
#          - url: /zigsight_static/topology-card.js
#            type: module
#          - url: /zigsight_static/topology-visualization.js
#            type: module
#
# 2. Add the card configuration below to your dashboard (see docs/ui.md)

# Device grid by type with link quality, battery and health
- type: custom:zigsight-topology-card
  title: Zigbee Network Topology

# Interactive network graph (same view as the ZigSight panel's Topology tab)
- type: custom:zigsight-topology-visualization
  title: Network Topology
  layout: radial
  height: 500
