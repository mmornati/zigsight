[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zigsight"
version = "1.1.0"
description = "Home Assistant diagnostics and optimization toolkit for Zigbee networks"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Marco Mornati", email = "marco.mornati@example.com"}
]
keywords = ["home-assistant", "zigbee", "diagnostics", "mqtt", "zha", "deconz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/mmornati/zigsight"
Repository = "https://github.com/mmornati/zigsight"
Issues = "https://github.com/mmornati/zigsight/issues"
Documentation = "https://github.com/mmornati/zigsight"

[project.optional-dependencies]
# Mirrors requirements-dev.txt (latest Home Assistant, Python 3.14); see
# requirements-test-min.txt for the minimum supported Home Assistant.
dev = [
    "pytest-homeassistant-custom-component==0.13.366",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "bandit==1.7.6",
    "pre-commit>=3.0.0",
    "types-python-dateutil",
]

[tool.setuptools]
packages = ["custom_components"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**" = ["S101"]     # use of assert

[tool.mypy]
# No python_version: mypy checks against the running interpreter, which is
# Python 3.13 with the minimum supported Home Assistant and Python 3.14 with
# the latest one (whose sources use 3.14-only syntax). CI type-checks both.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "homeassistant.helpers.*",
    "homeassistant.components.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--asyncio-mode=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/zigsight"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/examples/*",
    # All integration modules (including the entity platforms and
    # diagnostics) are exercised against a real hass fixture; nothing of
    # custom_components/zigsight is omitted any more.
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if False:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
